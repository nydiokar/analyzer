# Local verification of the production image.
#
#   docker compose -f docker-compose.backend.yml up --build
#
# Reads .env from the host at runtime; the file never enters the image
# (see .dockerignore). Host-facing services are reached via
# host.docker.internal, so DATABASE_URL/REDIS_HOST pointing at "localhost"
# will not resolve — localhost inside a container is the container itself.
# Override them here rather than editing .env.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sova-backend:local
    container_name: sova-backend
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: production
      # Mirrors the Terraform-derived ceiling; see locals.node_options.
      NODE_OPTIONS: --max-old-space-size=3072
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
