global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: app
    scrape_interval: 10s
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['127.0.0.1:3001']

  - job_name: bullmq
    scrape_interval: 5s
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['127.0.0.1:3001']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'bullmq_.*'
        action: keep

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']

  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
