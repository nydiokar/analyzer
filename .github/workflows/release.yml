name: Release

on:
  push:
    tags:
      - '@sova-intel/mcp@*'
      - '@sova-intel/sdk@*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @sova-intel/sdk build

      - name: Build MCP
        run: pnpm --filter @sova-intel/mcp build

      - name: Test MCP
        run: pnpm --filter @sova-intel/mcp test

      - name: Verify package version matches tag
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG##*@}"

          if [[ "$TAG" == @sova-intel/sdk@* ]]; then
            PKG="packages/sdk/package.json"
          else
            PKG="packages/sova-intel-mcp/package.json"
          fi

          PKG_VERSION=$(node -p "require('./$PKG').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Error: $PKG version ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @sova-intel/sdk build

      - name: Build MCP
        run: pnpm --filter @sova-intel/mcp build

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF##*@}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SDK to npm
        if: "startsWith(github.ref, 'refs/tags/@sova-intel/sdk@') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta')"
        run: pnpm --filter @sova-intel/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP to npm
        if: "startsWith(github.ref, 'refs/tags/@sova-intel/mcp@') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta')"
        run: pnpm --filter @sova-intel/mcp publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
