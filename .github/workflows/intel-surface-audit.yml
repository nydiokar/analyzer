name: Intel Surface Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/api/controllers/intel.controller.ts'
      - 'src/api/shared/dto/intel-public.dto.ts'
      - 'src/api/shared/dto/wallet-hud.dto.ts'
      - 'src/api/services/wallet-hud.service.ts'
      - 'src/api/modules/intel-openapi.module.ts'
      - 'packages/sdk/**'
      - 'documentation/agent-skill/**'
      - 'artifacts/intel-openapi.json'
      - 'scripts/export-intel-openapi.ts'
      - 'scripts/generate-intel-sdk-contract.ts'
      - 'scripts/intel-surface-audit.ts'
      - 'package.json'

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4
        with:
          path: analyzer

      - name: Checkout public docs repo
        uses: actions/checkout@v4
        with:
          repository: nydiokar/sova-intel
          path: sova-intel

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        working-directory: analyzer
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        working-directory: analyzer
        run: pnpm run build

      - name: Export Intel OpenAPI artifact
        working-directory: analyzer
        run: pnpm run intel:openapi

      - name: Generate SDK contract
        working-directory: analyzer
        run: pnpm run intel:sdk

      - name: Run strict Intel surface audit
        working-directory: analyzer
        env:
          INTEL_PUBLIC_DOCS_ROOT: ${{ github.workspace }}/sova-intel
        run: pnpm run intel:audit:strict

      - name: Verify generated Intel artifacts are committed
        working-directory: analyzer
        run: git diff --exit-code -- artifacts/intel-openapi.json packages/sdk/src/generated-intel-contract.ts
