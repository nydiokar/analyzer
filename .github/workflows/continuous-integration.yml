name: Continuous Integration

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/sdk/**'
      - 'packages/sova-intel-mcp/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/sdk/**'
      - 'packages/sova-intel-mcp/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Backend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @sova-intel/sdk run build

      - name: Build MCP
        run: pnpm --filter @sova-intel/mcp run build

      - name: Test MCP
        run: pnpm --filter @sova-intel/mcp run test

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Type-check Backend
        run: pnpm run verify

      - name: Lint Backend
        run: pnpm run lint

      - name: Build Backend
        run: pnpm run build

      - name: Install Frontend Dependencies
        working-directory: ./dashboard
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: ./dashboard
        run: pnpm run build
