# Full production stack: app + Postgres + Redis, one command, local or remote.
#
#   docker compose up -d --build
#
# Fill .env first (see .env.example). Postgres and Redis run as containers
# with named volumes, so data survives restarts and image rebuilds.
#
# Migrations run automatically via the "migrate" service before "app" starts —
# no manual `prisma migrate deploy` step needed.

services:
  postgres:
    image: postgres:16
    container_name: analyzer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sova_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sova_analyzer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sova_app} -d ${POSTGRES_DB:-sova_analyzer}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:latest
    container_name: analyzer-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: sova-backend:local
    container_name: sova-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sova_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sova_analyzer}
    entrypoint: ["node"]
    command: ["node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sova-backend:local
    container_name: sova-backend
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sova_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sova_analyzer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # V8 old-space ceiling derived from the container memory limit below, so
      # the two cannot drift apart (mirrors terraform/main.tf's node_options
      # for the Cloud Run path). Update both together if BACKEND_MEMORY_MB changes.
      NODE_OPTIONS: --max-old-space-size=${BACKEND_HEAP_MB:-3072}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_MB:-4096}m
    cpus: ${BACKEND_CPUS:-2.0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # One-off maintenance/admin runner. It is only started when explicitly
  # invoked through `pnpm admin:run ...` or a command such as
  # `pnpm user:manage list`.
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: sova-admin:local
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sova_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sova_analyzer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["pnpm", "exec", "ts-node", "-r", "tsconfig-paths/register"]
    profiles: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
